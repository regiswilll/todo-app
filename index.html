<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will T — Sales Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <div class="header-text">
          <h1 id="name"></h1>
          <p id="role" class="role"></p>
        </div>
        <div class="header-photos">
          <img src="21A04B16-7D09-4610-AC3D-7DC0662C3E78_4_5005_c.jpeg" alt="Stone ceiling and columns lit in warm amber light through stained glass">
          <img src="C60C5DE3-99B7-4B94-82B8-6644581D4BD4_4_5005_c.jpeg" alt="Tall columns and vaulted ceiling lit in green and blue light through stained glass">
        </div>
      </div>
      <nav class="nav">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="about" class="section">
      <h2>About</h2>
      <div id="about-text"></div>
    </section>

    <section id="skills" class="section">
      <h2>Skills</h2>
      <ul id="skills-list" class="skills"></ul>
    </section>

    <section id="projects" class="section">
      <h2>Projects</h2>
      <div id="projects-grid" class="projects"></div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <ul id="contact-list" class="contact"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-text"></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
